<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Page 2</title>
	<style>
		body {
			margin: 0;
			min-height: 100vh;
			display: flex;
			justify-content: center;
			align-items: center;
			background: #eaeaea;
			padding: 20px;
			box-sizing: border-box;
		}
		img {
			display: block;
			max-width: 100%;
			height: auto;
			max-height: calc(100vh - 40px);
			object-fit: contain;
			box-shadow: 0 0 0 1px rgba(0,0,0,0.05);
		}
	</style>
</head>
<body>
	<img src="page2.jpg" alt="Page 2">
</body>
